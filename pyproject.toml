[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swatterfly"
version = "0.1.0"
description = "Research scaffold for an insect-inspired autonomous interceptor drone"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
