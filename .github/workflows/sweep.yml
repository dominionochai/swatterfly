name: Phase-3 baseline sweep

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Document optional v2e package layout
        shell: bash
        run: |
          cat <<'EOF'
          v2e 1.5.1 setup.py uses find_packages() for v2ecore and installs v2e.py as a script; it does not install a top-level v2e import. The sweep therefore preserves the deterministic synthetic backend.
          EOF

      - name: Select deterministic event backend
        shell: bash
        run: |
          echo "v2e import is not provided by the v2e 1.5.1 distribution; selecting the deterministic synthetic backend."
          echo "SWATTERFLY_EVENT_BACKEND=synthetic" >> "$GITHUB_ENV"
          echo "SWATTERFLY_EVENT_BACKEND=synthetic"

      - name: Run tests
        id: tests
        run: python -m pytest tests src/backend/tests -q

      - name: Run Phase-3 baseline sweep
        id: sweep
        if: steps.tests.outcome == 'success'
        shell: bash
        run: |
          mkdir -p data/phase3_baseline
          echo "Running sweep with backend: ${SWATTERFLY_EVENT_BACKEND:-synthetic}"
          python scripts/sweep_stage1.py \
            --backend "${SWATTERFLY_EVENT_BACKEND:-synthetic}" \
            --output data/phase3_baseline

      - name: Configure git identity and commit exact baseline artifacts
        id: commit
        if: steps.tests.outcome == 'success' && steps.sweep.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/phase3_baseline/results.csv \
            data/phase3_baseline/trajectories.csv \
            data/phase3_baseline/events.csv \
            data/phase3_baseline/metadata.json \
            data/phase3_baseline/error_by_latency.png
          if git diff --cached --quiet; then
            echo "No baseline artifact changes to commit."
            exit 0
          fi
          git commit -m "Update Phase-3 baseline artifacts"
          git push origin HEAD:main

      - name: Upload baseline artifacts when commit or push fails
        if: always() && steps.sweep.outcome == 'success' && steps.commit.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: phase3-baseline
          path: data/phase3_baseline
          if-no-files-found: warn
          retention-days: 14
