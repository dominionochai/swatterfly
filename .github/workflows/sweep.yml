name: Phase-3 baseline sweep

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Attempt optional v2e installation
        shell: bash
        run: |
          set +e
          echo "Attempting CPU-only torch install for optional v2e support."
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          torch_status=$?
          if [ "$torch_status" -ne 0 ]; then
            echo "CPU torch install failed (status $torch_status); continuing with the v2e attempt."
          fi
          python -m pip install -e ".[event-camera]"
          v2e_status=$?
          if [ "$v2e_status" -eq 0 ]; then
            echo "Optional v2e installation completed."
          else
            echo "Optional v2e installation failed (status $v2e_status); the sweep will use the deterministic local renderer."
          fi
          exit 0

      - name: Select a verified event backend
        shell: bash
        run: |
          if python - <<'PY'
          try:
              import v2e
          except Exception as exc:
              print(f"v2e import unavailable ({exc}); using the deterministic local renderer.")
              raise SystemExit(1)
          print("v2e imported successfully; selecting the v2e-compatible backend.")
          PY
          then
            echo "SWATTERFLY_EVENT_BACKEND=v2e" >> "$GITHUB_ENV"
            echo "SWATTERFLY_EVENT_BACKEND=v2e"
          else
            echo "v2e unavailable; selecting the deterministic synthetic backend."
            echo "SWATTERFLY_EVENT_BACKEND=synthetic" >> "$GITHUB_ENV"
            echo "SWATTERFLY_EVENT_BACKEND=synthetic"
          fi

      - name: Run tests
        id: tests
        run: python -m pytest tests src/backend/tests -q

      - name: Run Phase-3 baseline sweep
        id: sweep
        if: steps.tests.outcome == 'success'
        shell: bash
        run: |
          mkdir -p data/phase3_baseline
          echo "Running sweep with backend: ${SWATTERFLY_EVENT_BACKEND:-synthetic}"
          python scripts/sweep_stage1.py \
            --backend "${SWATTERFLY_EVENT_BACKEND:-synthetic}" \
            --output data/phase3_baseline

      - name: Configure git identity and commit exact baseline artifacts
        id: commit
        if: steps.tests.outcome == 'success' && steps.sweep.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/phase3_baseline/results.csv \
            data/phase3_baseline/trajectories.csv \
            data/phase3_baseline/events.csv \
            data/phase3_baseline/metadata.json \
            data/phase3_baseline/error_by_latency.png
          if git diff --cached --quiet; then
            echo "No baseline artifact changes to commit."
            exit 0
          fi
          git commit -m "Update Phase-3 baseline artifacts"
          git push origin HEAD:main

      - name: Upload baseline artifacts when commit or push fails
        if: always() && steps.sweep.outcome == 'success' && steps.commit.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: phase3-baseline
          path: data/phase3_baseline
          if-no-files-found: warn
          retention-days: 14
