name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r src/backend/requirements.txt -r src/backend/requirements-test.txt

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: src/dashboard
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run dashboard typecheck when configured
        working-directory: src/dashboard
        run: |
          if node -e "process.exit((require('./package.json').scripts || {}).typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            echo "No typecheck script configured; skipping."
          fi

      - name: Build dashboard
        working-directory: src/dashboard
        run: npm run build
